{% extends "auctions/layout.html" %}
{% block body %}
<h2>Watchlist</h2>
{% if listings %}
  <ul>
    {% for l in listings %}
      <li><a href="{% url 'listing' l.id %}">{{ l.title }}</a> — ${{ l.starting_bid }}</li>
    {% endfor %}
  </ul>
{% else %}
  <p>Your watchlist is empty.</p>
{% endif %}
{% endblock %}
