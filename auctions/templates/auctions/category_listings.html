{% extends "auctions/layout.html" %}

{% block body %}
  <h2>Listings in "{{ category }}"</h2>
  <ul>
    {% for listing in listings %}
      <li>
        <a href="{% url 'listing' listing.id %}">{{ listing.title }}</a> - ${{ listing.starting_bid }}
      </li>
    {% empty %}
      <li>No active listings in this category.</li>
    {% endfor %}
  </ul>
{% endblock %}
